name: xta
description: A private, read-oriented way to browse X

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as CFBundleVersion.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html

version: 4.12.0+400001076

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: 3.44.4

dependency_overrides:
  # auto_direction pins an old intl (^0.17/^0.18) that conflicts with
  # dart_twitter_api's intl ^0.20.0. auto_direction only uses the stable
  # Bidi.detectRtlDirectionality API, so forcing the modern intl is safe.
  intl: ^0.20.2
  # file_picker 12-beta / package_info_plus 10 / share_plus 13 need win32 ^6,
  # but flutter_iconpicker (dcli <8) and arb_utils (dcli <=10) pull dcli 7.x /
  # dart_console 4.x, whose Windows FFI code is written against the win32 ^5 API
  # fails to *compile* (even on Linux, since dcli uses runtime Platform
  # checks, not conditional imports). Forcing dcli/dart_console to their win32-6
  # majors lets the codegen CLIs build. These are dev-only codegen tools never
  # imported by app code, and win32 is a no-op off Windows, so this is safe.
  win32: ^6.2.0
  dcli: ^9.0.0
  dart_console: ^5.0.0

dependencies:
  flutter:
    sdk: flutter

  # Core Flutter dependencies
  flutter_localizations:
    sdk: flutter

  # API & Networking
  http: ^1.6.0
  dart_twitter_api: 0.6.0
  html: ^0.15.6

  # UI & Media
  auto_direction: ^0.0.7
  extended_image: ^10.1.0
  extended_nested_scroll_view: ^6.2.1
  flutter_staggered_grid_view: ^0.7.0
  infinite_scroll_pagination: ^5.1.1
  flutter_cache: ^0.1.0
  flutter_material_color_picker: ^1.2.0
  # 12.0.0-beta moves to win32 ^6.2.0, letting package_info_plus 10 / share_plus
  # 13 / wakelock_plus 1.6 / chewie 1.14 (all win32 ^6) resolve alongside it.
  # Still exact-pinned rather than ^: the plugin's Android sources import
  # kotlinx.coroutines without declaring the dependency, so it only compiles
  # while another module puts coroutines on the compile classpath (currently
  # 1.11.0). Re-check the Android build before moving to a newer beta.
  file_picker: 12.0.0-beta.7
  flutter_file_dialog: ^3.3.1
  flutter_iconpicker: ^4.0.3
  flutter_portal: ^1.1.4
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.13.0
  webview_cookie_manager_plus: ^2.0.16

  # Localization & Styling
  intl: any
  dynamic_color: ^1.8.1

  # State Management & Data
  pref: ^2.8.0
  provider: ^6.1.5
  flutter_triple: ^3.0.0

  # Utilities & Helpers
  crypto: ^3.0.7
  html_unescape: ^2.0.0
  logging: ^1.3.0
  measure_size: ^5.0.2
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.4
  quiver: ^3.2.2
  scroll_to_index: ^3.0.1
  secure_content: ^1.0.1
  share_plus: ^13.3.0
  sqflite: ^2.4.3
  sqflite_common: ^2.5.0
  sqflite_migration_plan: ^1.0.0
  timeago: ^3.7.0
  app_links: ^7.2.1
  url_launcher: ^6.3.2
  android_intent_plus: ^6.1.0
  uuid: ^4.6.0
  visibility_detector: ^0.4.0+2
  # Declared directly only so the win32 ^6 resolution stays consistent with
  # file_picker / share_plus; the wakelock itself is driven by chewie/media_kit.
  wakelock_plus: ^1.7.0

  # Miscellaneous
  async_button_builder: ^3.0.0+1
  audio_service: ^0.18.15
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  audio_session: ^0.2.4
  ffcache: ^1.1.0
  flutter_tts: ^4.2.5
  bip340: ^0.3.1
  bech32: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  dart_pubspec_licenses: ^3.2.0
  intl_utils: ^2.8.1
  sqflite_common_ffi: ^2.2.0+1
  arb_utils: ^0.11.1

  # Scroll-jank benchmark (test_driver/). Device-only, never part of
  # `flutter test`, so it costs nothing in CI.
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material icons font is
  # included with your application, so that you can use the icons in
  # the material icons class.
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/fonts/Inter-OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  generate: true

flutter_intl:
  enabled: true
  class_name: L10n

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  adaptive_icon_background: "assets/icon-background.png"
  adaptive_icon_foreground: "assets/icon-foreground-432x432.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "assets/icon-monochrome-432x432.png"
