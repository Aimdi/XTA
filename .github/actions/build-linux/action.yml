name: Build the Linux desktop bundle
description: >-
  Builds the Linux release bundle and packages it as the release tarball plus
  its Arch PKGBUILD, in build/linux-release. Shared by the PR check in
  verify.yml and the release upload in linux-desktop.yml.

inputs:
  release-tag:
    description: Tag baked into the build and named in the packages
    required: true

runs:
  using: composite
  steps:
    # The runner has clang, cmake and pkg-config; GTK and libmpv (media_kit's
    # player) are what the Linux runner and plugins link against.
    - name: Install the Linux toolchain
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q ninja-build libgtk-3-dev libmpv-dev

    - name: Install and set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: .fvmrc
        cache: true

    # Pillow sizes the icon the package installs; pinned in requirements.txt.
    - name: Set up Python
      shell: bash
      run: |
        python3 -m venv .venv
        .venv/bin/pip install -q -r requirements.txt

    - name: Build and package
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        flutter config --no-analytics
        flutter pub get
        dart run intl_utils:generate
        dart run flutter_iconpicker:generate_packs --packs material
        flutter build linux --release --no-tree-shake-icons --dart-define=XTA_RELEASE_TAG="$RELEASE_TAG"
        PATH="$PWD/.venv/bin:$PATH" scripts/package_linux.sh build/linux/x64/release/bundle "$RELEASE_TAG" build/linux-release

    # makepkg refuses to run as root, and takes the tarball beside the
    # PKGBUILD rather than downloading it, so this also proves the PKGBUILD.
    - name: Build the Arch package
      shell: bash
      run: |
        docker run --rm -v "$PWD/build/linux-release:/out" archlinux:base-devel bash -euc '
          useradd -m builder
          cp -r /out /home/builder/pkg
          chown -R builder /home/builder/pkg
          su builder -c "cd /home/builder/pkg && makepkg --force --nodeps --noconfirm"
          cp /home/builder/pkg/*.pkg.tar.zst /out/'
        ls -l build/linux-release
