name: App reading review

on:
  pull_request:
    branches: [claude/main, codex/mastodon-client]
    paths:
      - 'lib/**'
      - 'test/**'
      - '.github/workflows/app-reading-review.yml'

permissions:
  contents: read

concurrency:
  group: app-reading-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  review:
    if: github.head_ref == 'codex/app-continuity' || github.head_ref == 'codex/reading-suite'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21.0.10'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Prepare pinned sources
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/commit.txt
      - name: Localize using the pinned runner SDK
        run: |
          python - <<'PYCODE'
          import l10n
          original = l10n.run
          l10n.run = lambda command: original(command[1:] if command[0] == 'fvm' else command)
          l10n.main()
          PYCODE
      - name: Format new Dart
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Match verify.yml: avoid reformatting old modules for a small fix.
          mapfile -t changed < <(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- '*.dart')
          dart format --line-length 120 "${changed[@]}"
          git diff --binary > review-artifacts/format.patch
      - name: Upload formatting
        uses: actions/upload-artifact@v4
        with:
          name: app-reading-format-${{ github.event.pull_request.head.sha }}
          path: review-artifacts/format.patch
          retention-days: 7
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee review-artifacts/analyze.txt
      - name: Reading and media journeys
        id: journeys
        if: steps.analyze.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        env:
          REVIEW_BRANCH: ${{ github.head_ref }}
        run: |
          set -o pipefail
          if [ "$REVIEW_BRANCH" = codex/reading-suite ]; then
            mapfile -t focused < <(find test -maxdepth 1 -name '*_test.dart' | sort | grep -E '/(article_read|bluesky_read|download_|offline_|podcast_|video_quality_|reading_suite)')
            test "${#focused[@]}" -gt 0
            flutter test "${focused[@]}" --reporter expanded --timeout 60s 2>&1 | tee review-artifacts/journeys.txt
          else
            flutter test test/mastodon_reading_experience_test.dart test/mastodon_archive_test.dart test/discover_reading_test.dart test/settings_direct_access_test.dart test/app_reading_layout_test.dart --reporter expanded --timeout 60s 2>&1 | tee review-artifacts/journeys.txt
          fi
      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reading-layout-${{ github.event.pull_request.head.sha }}
          path: |
            review-artifacts/journeys.txt
            review-artifacts/renders
          retention-days: 7
      - name: Full tests
        id: tests
        if: steps.journeys.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee review-artifacts/tests.txt
      - name: Upload comparisons before the Android build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reading-comparison-${{ github.event.pull_request.head.sha }}
          path: |
            review-artifacts/renders
            review-artifacts/tests.txt
            review-artifacts/analyze.txt
            review-artifacts/commit.txt
          retention-days: 7
      - name: Debug APK
        id: apk
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          python -m pip install -r requirements.txt
          python generate_icons.py
          dart run flutter_launcher_icons
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk review-artifacts/xta-app-reading-debug.apk
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reading-review-${{ github.event.pull_request.head.sha }}
          path: review-artifacts
          retention-days: 7
      - name: Enforce verification
        if: always()
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          JOURNEYS: ${{ steps.journeys.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          APK: ${{ steps.apk.outcome }}
        run: |
          test "$ANALYZE" = success
          test "$JOURNEYS" = success
          test "$TESTS" = success
          test "$APK" = success
