name: Build and release

# Builds the APKs and attaches them straight to a release, without the
# intermediate Actions artifact — release assets do not count against the
# account's artifact storage quota.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string
  # Cursor / GitHub App tokens can fire repository_dispatch but not
  # workflow_dispatch; tag pushes from the same app also sometimes skip
  # the `release` workflow. This path keeps APK cuts unblocked.
  repository_dispatch:
    types: [build-release]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the requested release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          cp scripts/release_integrity.py "$RUNNER_TEMP/xta-release-integrity.py"
          cp certificate-fingerprints.txt "$RUNNER_TEMP/xta-release-certificate.txt"
          python3 "$RUNNER_TEMP/xta-release-integrity.py" checkout -- "$RELEASE_TAG"

      - name: Install and set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          # Pinned exactly, not '21.x': a reproducible build has to name the
          # JDK that produced it. See docs/reproducible-builds.md.
          java-version: '21.0.10'

      - name: Install and set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Set up signing key
        run: |
          missing=()
          [ -z "$SIGNING_KEY" ] && missing+=(SIGNING_KEY)
          [ -z "$KEY_STORE_PASSWORD" ] && missing+=(KEY_STORE_PASSWORD)
          [ -z "$KEY_PASSWORD" ] && missing+=(KEY_PASSWORD)
          [ -z "$KEY_ALIAS" ] && missing+=(KEY_ALIAS)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}"
            echo "Release APKs must use a stable keystore. Without SIGNING_KEY,"
            echo "CI falls back to a fresh debug.keystore on every runner — Android"
            echo "then refuses in-place updates (uninstall/reinstall every release)."
            echo "See docs/signing.md for how to create the keystore and set secrets."
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > android/app/key.jks
          if [ ! -s android/app/key.jks ]; then
            echo "::error::SIGNING_KEY decoded to an empty file"
            exit 1
          fi
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Generate icons
        run: |
          python -mvenv .venv
          source ./.venv/bin/activate
          pip install -r requirements.txt
          python generate_icons.py
          deactivate

      - name: Build
        run: |
          export KEY_PATH=key.jks

          flutter clean
          flutter config --no-analytics
          flutter pub get
          dart run flutter_launcher_icons
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
          python3 "$RUNNER_TEMP/xta-release-integrity.py" check-source "$RUNNER_TEMP/xta-source-checks.json"

          # Create a directory for our release APKs
          mkdir -pv build/app/outputs/release

          # pubspec keeps the upstream version (4.12.0), so the tag is the only
          # thing that identifies which release this APK is. The update check
          # compares against it; without it every launch reports an update.
          RELEASE_TAG="${RELEASE_TAG:?no tag resolved}"

          # Build our big boy APK, and move it into the release APKs folder
          flutter build apk --release --no-tree-shake-icons --dart-define=XTA_RELEASE_TAG="$RELEASE_TAG"
          mv build/app/outputs/apk/release/*.apk build/app/outputs/release

          # Build our ABI-specific APKs and move them into the release APKs folder
          flutter build apk --release --no-tree-shake-icons --dart-define=XTA_RELEASE_TAG="$RELEASE_TAG" --split-per-abi --target-platform=android-x64,android-arm,android-arm64
          mv build/app/outputs/apk/release/*.apk build/app/outputs/release
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}

      - name: Verify release APKs and record provenance
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 "$RUNNER_TEMP/xta-release-integrity.py" record build/app/outputs/release --tag "$RELEASE_TAG" --checks "$RUNNER_TEMP/xta-source-checks.json"
          python3 "$RUNNER_TEMP/xta-release-integrity.py" verify build/app/outputs/release --tag "$RELEASE_TAG" --certificate "$RUNNER_TEMP/xta-release-certificate.txt"

      - name: Create release with APKs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ steps.tag.outputs.sha }}
          # release.yml ships these notes; without them a dispatched release
          # publishes with an empty body and no install instructions.
          body_path: release-notes.md
          files: |
            build/app/outputs/release/*.apk
            build/app/outputs/release/release-build.json
            build/app/outputs/release/SHA256SUMS
          fail_on_unmatched_files: true
