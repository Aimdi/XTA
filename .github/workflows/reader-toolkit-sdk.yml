name: Reader toolkit SDK
on:
  push:
    branches: ['chore/reader-toolkit-validation']
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Prepare pinned SDK
        run: |
          flutter --version
          sdk="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          mkdir -p sdk-parts
          tar -C "$sdk" --exclude='./.git' --exclude='./examples' --exclude='./dev' --exclude='./bin/cache/artifacts/engine/android*' --exclude='./bin/cache/artifacts/engine/linux-arm64*' --exclude='./bin/cache/artifacts/engine/linux-x64-profile' --exclude='./bin/cache/artifacts/engine/linux-x64-release' --exclude='./bin/cache/artifacts/engine/windows*' --exclude='./bin/cache/artifacts/engine/darwin*' -czf - . | split -b 28M - sdk-parts/flutter-sdk-
          ls -lh sdk-parts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reader-flutter-sdk-aa
          path: sdk-parts/flutter-sdk-aa
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reader-flutter-sdk-ab
          path: sdk-parts/flutter-sdk-ab
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
