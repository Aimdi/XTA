name: Format final Home files

# One-time branch-only formatter. It does not update any retained workflow.
on:
  push:
    branches: ['ui/unified-home-controls']
    paths: ['.github/workflows/format-home-final.yml']
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'Aimdi/XTA' && github.ref == 'refs/heads/ui/unified-home-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Format exactly the two changed files
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
          dart format --line-length 120 lib/plugins/plugin_home_dock.dart test/plugin_home_dock_test.dart
          dart format --output=none --set-exit-if-changed --line-length 120 lib/plugins/plugin_home_dock.dart test/plugin_home_dock_test.dart
      - name: Verify Home regressions and analysis
        run: |
          mkdir -p review-artifacts
          flutter test --no-pub --reporter expanded --timeout 90s --dart-define=RENDER_UNIFIED_HOME=true test/unified_home_picker_test.dart test/unified_home_layout_test.dart test/plugin_home_dock_test.dart test/home_dock_lifetime_test.dart test/home_reading_controls_test.dart test/home_timeline_picker_test.dart test/alt_microblogging_journey_test.dart test/plugin_reader_accessibility_test.dart test/substack_home_controls_test.dart > review-artifacts/home-tests.log 2>&1
          tail -n 8 review-artifacts/home-tests.log
          flutter analyze --no-fatal-infos > review-artifacts/analysis.log 2>&1
      - name: Save formatter and layout evidence
        if: always()
        run: |
          mkdir -p review-artifacts
          git diff --binary -- lib/plugins/plugin_home_dock.dart test/plugin_home_dock_test.dart > review-artifacts/format.patch
          git rev-parse HEAD > review-artifacts/source-parent.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-home-format-${{ github.run_id }}
          path: review-artifacts/
          retention-days: 2
          if-no-files-found: error
      - name: Commit formatted code and remove this one-time job
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/ui/unified-home-controls | cut -f1)
          test "$current" = "$EXPECTED_HEAD"
          git add -- lib/plugins/plugin_home_dock.dart test/plugin_home_dock_test.dart
          git rm -- .github/workflows/format-home-final.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: apply pinned Dart formatting to final Home layout and tests'
          git push origin HEAD:refs/heads/ui/unified-home-controls
