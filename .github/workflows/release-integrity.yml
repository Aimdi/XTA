name: Release integrity

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/release_integrity.py'
      - 'scripts/tests/**'
      - 'certificate-fingerprints.txt'
  push:
    branches: [claude/main]
    paths:
      - '.github/workflows/**'
      - 'scripts/release_integrity.py'
      - 'scripts/tests/**'
      - 'certificate-fingerprints.txt'

permissions:
  contents: read

jobs:
  integrity:
    name: Release source and artifact checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21.0.10'
      - name: Install workflow parser
        run: python -m pip install PyYAML==6.0.3
      - name: Download the published reference APK
        run: curl --fail --location --silent --show-error --retry 2 --max-time 120 --output "$RUNNER_TEMP/xta-aimdi128.apk" https://github.com/Aimdi/XTA/releases/download/aimdi128/xta-aimdi128_arm64-v8a.apk
      - name: Test source selection, rejected artifacts and real APK inspection
        env:
          XTA_REFERENCE_APK: ${{ runner.temp }}/xta-aimdi128.apk
        run: python -m unittest discover -s scripts/tests -v
