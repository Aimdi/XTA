name: Emulator QA

# Runs the Maestro flows of .maestro/ on an Android emulator, against the
# stand-in for X that tool/mock_x serves from test/fixtures, and keeps a video
# of each flow (docs/mock-x.md). No X account or live X request is involved.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.maestro/**'
      - 'tool/mock_x/**'
      - 'lib/utils/mock_x*.dart'
      - 'lib/community/**'
      - 'lib/profile/**'
      - 'lib/status.dart'
      - 'android/app/src/profile/**'
      - 'test/fixtures/**'
      - 'lib/speech/**'
      - 'integration_test/voice_engine_test.dart'
      - 'scripts/voice_engine_archives.py'
      - 'android/app/build.gradle'
      - '.github/workflows/emulator-qa.yml'

permissions:
  contents: read

concurrency:
  group: emulator-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: '2.11.0'
  MAESTRO_SHA256: '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a'

jobs:
  flows:
    name: Maestro flows on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21.0.10'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Generate sources and icons
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
          python3 -m pip install -r requirements.txt
          python3 generate_icons.py
          dart run flutter_launcher_icons
      - name: Build the app against the stand-in for X
        run: >-
          flutter build apk --profile --target-platform android-x64 --no-tree-shake-icons
          --dart-define=XTA_MOCK_X=http://10.0.2.2:8787
      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Install ffmpeg to trim the videos
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: dart run tool/mock_x/emulator_qa.dart build/app/outputs/flutter-apk/app-profile.apk .maestro emulator-output
      - name: Keep the videos and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-qa
          path: emulator-output
          if-no-files-found: ignore

  # The voice engine, left out of the APK, downloads, loads from app storage
  # and reads a sentence on Android itself (docs/specs/downloadable-voice-engine.md).
  voice-engine:
    name: Voice engine on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21.0.10'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Generate sources
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
      - name: Serve the engine and a voice to the emulator
        run: |
          set -euo pipefail
          mkdir -p build/voice-test
          python3 scripts/voice_engine_archives.py build/voice-test
          voice=vits-piper-en_US-libritts_r-medium-int8.tar.bz2
          curl -fsSL -o "build/voice-test/$voice" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$voice"
          echo "7e4552e239988f4896872822b56e99e0e9e00958164e3f6bdf5ee14391fbe829  build/voice-test/$voice" | sha256sum -c -
          nohup python3 -m http.server 8788 --directory build/voice-test > build/voice-test-server.log 2>&1 &
          sleep 1
          curl -fsS -o /dev/null "http://127.0.0.1:8788/$voice"
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/voice_engine_test.dart --dart-define=XTA_VOICE_TEST_SERVER=http://10.0.2.2:8788
      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-engine-check
          path: build/voice-test-server.log
          if-no-files-found: ignore
