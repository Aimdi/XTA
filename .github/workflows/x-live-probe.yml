name: X live probe (temporary)
# run 6

on:
  push:
    branches: [claude/admiring-mayer-bdfg95]
    paths: ['.github/workflows/x-live-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Prepare pinned sources
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
      - name: What x.com answers this runner
        timeout-minutes: 4
        run: python3 .github/workflows/x-live-probe.py
      - name: What the sign-in page loads
        timeout-minutes: 3
        run: python3 .github/workflows/x-login-probe.py
      - name: Try the sign-in page as a third bootstrap page (CI only, not committed)
        run: |
          python3 - <<'PATCH'
          p = 'lib/client/x_client_transaction_id/client_transaction.dart'
          s = open(p).read()
          old = "      Uri.https('x.com', '/search', {'q': 'AI', 'f': 'live'}),\n"
          assert old in s
          s = s.replace(old, old + "      Uri.https('x.com', '/i/flow/login'),\n")
          old_skip = "if (uri == pages.first && const [403, 404].contains(response.statusCode)) continue;"
          assert old_skip in s
          s = s.replace(old_skip, "if (uri != pages.last && const [403, 404].contains(response.statusCode)) continue;")
          open(p, 'w').write(s)
          p = 'lib/client/x_client_transaction_id/signing_assets.dart'
          s = open(p).read()
          anchor = "    for (final uri in linked) {\n      if (signer(uri)) return uri;\n    }\n"
          assert anchor in s
          inline = (
              "    for (final script in page.querySelectorAll('script:not([src])')) {\n"
              "      linked.addAll(_SigningAssetSearch._references(Uri.https('x.com', '/'), script.text, _SigningAssetSearch._literal));\n"
              "    }\n"
          )
          s = s.replace(anchor, inline + anchor)
          open(p, 'w').write(s)
          PATCH
          git diff
      - name: Bootstrap smoke
        continue-on-error: true
        run: flutter test test/live/x_bootstrap_smoke_test.dart --no-pub --dart-define=RUN_LIVE=true --reporter expanded
      - name: Guest smoke
        continue-on-error: true
        run: flutter test test/live/guest_api_smoke_test.dart --no-pub --dart-define=RUN_LIVE=true --reporter expanded
      - name: Endpoint canary
        continue-on-error: true
        run: flutter test test/live/endpoint_canary_test.dart --no-pub --dart-define=RUN_LIVE=true --reporter expanded
