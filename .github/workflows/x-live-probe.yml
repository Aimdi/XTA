name: X live probe (temporary)

on:
  push:
    branches: [claude/admiring-mayer-bdfg95]
    paths: ['.github/workflows/x-live-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Prepare pinned sources
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
      - name: Raw bootstrap pages
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import json, re
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          headers = {
              "Accept-Language": "en-US,en;q=0.9",
              "Cache-Control": "no-cache",
              "Referer": "https://x.com",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36",
              "X-Twitter-Active-User": "yes",
              "X-Twitter-Client-Language": "en",
          }
          for route in ("/home", "/search?q=AI&f=live", "/explore", "/X"):
              try:
                  try:
                      response = urlopen(Request("https://x.com" + route, headers=headers), timeout=15)
                  except HTTPError as error:
                      response = error
                  with response:
                      body = response.read()
                      status = response.status
                      final = response.geturl() if hasattr(response, "geturl") else ""
                  html = body.decode("utf-8", errors="replace")
                  scripts = re.findall(r'<script[^>]+src="([^"]+)"', html)
                  preloads = re.findall(r'<link[^>]+rel="modulepreload"[^>]+href="([^"]+)"', html)
                  print(json.dumps({
                      "route": route.split("?")[0],
                      "status": status,
                      "final": final.split("?")[0],
                      "bytes": len(body),
                      "verification": bool(re.search(r'name="twitter-site-verification"\s+content="[^"]+"', html)),
                      "frames": len(re.findall(r'id="loading-x-anim', html)),
                      "ondemand_text": "ondemand.s" in html,
                      "sign_o_text": "sign.o" in html,
                      "ondemand_index": bool(re.search(r'''(?:^|[,{])\s*["']?(\d+)["']?\s*:\s*["']ondemand\.s["']''', html, re.M)),
                      "scripts": [s.split("/")[-1] for s in scripts][:40],
                      "preloads": [s.split("/")[-1] for s in preloads][:40],
                      "title": (re.search(r"<title[^>]*>([^<]*)", html) or [None, None])[1],
                  }))
                  if status != 200:
                      print(html[:600])
              except (URLError, TimeoutError, OSError) as error:
                  print(json.dumps({"route": route, "network_error": repr(error)}))
          PY
      - name: Bootstrap smoke
        continue-on-error: true
        run: flutter test test/live/x_bootstrap_smoke_test.dart --no-pub --dart-define=RUN_LIVE=true --reporter expanded
      - name: Guest smoke
        continue-on-error: true
        run: flutter test test/live/guest_api_smoke_test.dart --no-pub --dart-define=RUN_LIVE=true --reporter expanded
      - name: Endpoint canary
        continue-on-error: true
        run: flutter test test/live/endpoint_canary_test.dart --no-pub --dart-define=RUN_LIVE=true --reporter expanded
