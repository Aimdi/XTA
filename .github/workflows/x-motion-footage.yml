name: x-motion-footage
# Temporary: more footage of X's rebuilt Android app, fetched from a runner.
on:
  push:
    branches: [claude/admiring-mayer-bdfg95]
    paths:
      - scripts/probe_tmp/**
      - .github/workflows/x-motion-footage.yml
permissions:
  contents: read
jobs:
  footage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null || true
      - run: pip install -q yt-dlp || true
      - run: python3 scripts/probe_tmp/footage.py "$RUNNER_TEMP/footage"
