name: Complete reviewed Home controls patch

# One-time branch-scoped materialization; removes itself after successful checks.
on:
  push:
    branches: ['ui/unified-home-controls']
    paths:
      - '.github/workflows/finish-home-controls.yml'
      - 'scripts/finish_home_controls_patch.py'
permissions:
  contents: read
jobs:
  finish:
    if: github.repository == 'Aimdi/XTA' && github.ref == 'refs/heads/ui/unified-home-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Apply exact-source UI and localization changes
        run: |
          python3 scripts/finish_home_controls_patch.py
          python3 - <<'PY'
          from pathlib import Path
          edits = [
              ('lib/plugins/plugin_home_reading_controls.dart', 'media.viewInsets.bottom > 0 ||', 'media.viewInsets.bottom > 0 || View.of(context).viewInsets.bottom > 0 ||'),
              ('test/home_dock_lifetime_test.dart', 'expect(find.byTooltip(L10n.current.search), findsOneWidget);', 'expect(find.byTooltip(L10n.current.plugin_mastodon_loaded_search), findsOneWidget);'),
              ('test/home_reading_controls_test.dart', "      final scrollController = ScrollController();\n      try {", "      final scrollController = ScrollController();\n      if (protection == 'keyboard') {\n        tester.view.viewInsets = const FakeViewPadding(bottom: 200);\n        addTearDown(tester.view.resetViewInsets);\n      }\n      try {"),
          ]
          for name, before, after in edits:
              p = Path(name)
              text = p.read_text()
              if text.count(before) != 1:
                  raise SystemExit('Unexpected source for reviewed fix: ' + name)
              p.write_text(text.replace(before, after, 1))
          PY
      - name: Generate and format with the pinned SDK
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
          dart format --line-length 120 lib/home/_feed.dart lib/plugins/plugin_home_dock.dart lib/plugins/plugin_home_reading_controls.dart lib/plugins/substack/substack_screen.dart lib/plugins/substack/substack_reading_toolbar.dart test/home_dock_lifetime_test.dart test/home_reading_controls_test.dart test/unified_home_layout_test.dart
          python3 l10n.py --check-only
          python3 scripts/validate_arb.py
          bash scripts/check_skill_sync.sh
      - name: Verify lifetime, collapse, navigation and assembled layouts
        run: |
          mkdir -p review-artifacts
          set +e
          timeout --signal=TERM --kill-after=10s 180s flutter test --no-pub --reporter expanded --timeout 90s --dart-define=RENDER_UNIFIED_HOME=true test/unified_home_picker_test.dart test/unified_home_layout_test.dart test/plugin_home_dock_test.dart test/home_dock_lifetime_test.dart test/home_reading_controls_test.dart test/home_timeline_picker_test.dart test/alt_microblogging_journey_test.dart test/plugin_reader_accessibility_test.dart test/substack_home_controls_test.dart > review-artifacts/home-tests.log 2>&1
          result=$?
          tail -n 100 review-artifacts/home-tests.log
          exit "$result"
      - name: Analyze
        if: always()
        run: |
          mkdir -p review-artifacts
          set +e
          flutter analyze --no-fatal-infos > review-artifacts/analysis.log 2>&1
          result=$?
          tail -n 30 review-artifacts/analysis.log
          exit "$result"
      - name: Record working-tree evidence
        if: always()
        run: |
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/source-parent.txt
          git diff --binary > review-artifacts/working-changes.patch
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('review-artifacts/home-review-source.zip', 'w', ZIP_DEFLATED) as z:
              for root in ('lib', 'test', 'docs', 'scripts'):
                  for p in Path(root).rglob('*'):
                      if p.is_file() and '__pycache__' not in p.parts and not p.as_posix().startswith('lib/generated/'):
                          z.write(p)
              for p in ('l10n.py', 'pubspec.yaml', 'pubspec.lock', '.fvmrc'):
                  z.write(p)
          PY
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: completed-home-controls-${{ github.run_id }}
          path: review-artifacts/
          retention-days: 2
          if-no-files-found: error
      - name: Commit only verified changes to the same PR and remove bootstrap
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/ui/unified-home-controls | cut -f1)
          test "$current" = "$EXPECTED_HEAD"
          git add -- lib/home/_feed.dart lib/plugins/plugin_home_dock.dart lib/plugins/plugin_home_reading_controls.dart lib/plugins/substack/substack_screen.dart lib/plugins/substack/substack_reading_toolbar.dart lib/l10n test/home_dock_lifetime_test.dart test/home_reading_controls_test.dart test/unified_home_layout_test.dart .github/workflows/unified-home-check.yml
          git rm -- .github/workflows/finish-home-controls.yml scripts/finish_home_controls_patch.py
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: retain Home reading controls and complete reversible reading-mode collapse'
          git push origin HEAD:refs/heads/ui/unified-home-controls
