name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - claude/main

jobs:
  android:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    steps:
      - name: Clone the repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install and set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          # Pinned exactly, not '21.x': a reproducible build has to name the
          # JDK that produced it. See docs/reproducible-builds.md.
          java-version: '21.0.10'

      - name: Install and set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Set up signing key
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > android/app/key.jks
            if [ ! -s android/app/key.jks ]; then
              echo "::warning::SIGNING_KEY decoded empty; falling back to debug signing for CI artifacts"
              rm -f android/app/key.jks
            fi
          else
            echo "::warning::No SIGNING_KEY secret — CI APK artifacts will be debug-signed (not for Obtainium / long-lived installs). See docs/signing.md"
          fi
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Cache build directory
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('**/build') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Generate icons
        run: |
          python -mvenv .venv
          source ./.venv/bin/activate
          pip install -r requirements.txt
          python generate_icons.py
          deactivate

      - name: Build
        run: |
          # Only use the release keystore if it was actually set up
          if [ -s android/app/key.jks ]; then
            export KEY_PATH=key.jks
          fi

          flutter clean
          flutter config --no-analytics
          flutter pub get
          dart run flutter_launcher_icons
          dart run dart_pubspec_licenses:generate
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material

          # Create a directory for our release APKs
          mkdir -pv build/app/outputs/release

          # Build our big boy APK, and move it into the release APKs folder
          flutter build apk --release --no-tree-shake-icons
          mv build/app/outputs/apk/release/*.apk build/app/outputs/release

          # Build our ABI-specific APKs and move them into the release APKs folder
          flutter build apk --release --no-tree-shake-icons --split-per-abi --target-platform=android-x64,android-arm,android-arm64
          mv build/app/outputs/apk/release/*.apk build/app/outputs/release
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Archive APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/release/*.apk
          # The publish workflow downloads this within minutes; keeping
          # artifacts around any longer just eats the account storage quota.
          retention-days: 1

