name: verify

# The build in ci.yml proves the app compiles. This proves it is *correct*:
# formatting, static analysis, unit tests, ARB integrity and skill-tree sync,
# on every pull request rather than only after a push to main.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - claude/main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arb:
    name: ARB integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # No Flutter needed, so this reports broken translations in seconds even
      # when the Dart job is still warming up.
      - name: Validate ARB files
        run: python scripts/validate_arb.py

  skills:
    name: Skill tree sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Neither Flutter nor Python needed: .claude/skills and .grok/skills are
      # hand-mirrored, and drift makes the two agents follow different rules.
      - name: Check .claude/skills and .grok/skills are identical
        run: bash scripts/check_skill_sync.sh

  dart:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Localization and icon packs are gitignored and needed for analysis.
      # The unused license generator is incompatible with Flutter 3.44.4.
      - name: Generate sources
        run: |
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material

      # Only files the PR *adds*. Dart 3.7's tall style would rewrite 195 of the
      # 250 existing files, and this fork regularly ports patches from upstream
      # XTA and Squawker — a mass reformat would turn every future port into a
      # conflict. New code is still born formatted.
      - name: Check formatting of new files
        if: github.event_name == 'pull_request'
        run: |
          git diff --diff-filter=A --name-only "$BASE_SHA" HEAD -- '*.dart' > /tmp/xta-added-dart-files
          mapfile -t added < /tmp/xta-added-dart-files
          if [ ${#added[@]} -eq 0 ]; then
            echo "No new Dart files."
            exit 0
          fi
          printf '%s\n' "${added[@]}"
          dart format --output=none --set-exit-if-changed --line-length 120 "${added[@]}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Alt Microblogging navigation and undo
        run: >-
          flutter test --reporter expanded --timeout 90s
          --dart-define=RENDER_ALT_MICROBLOGGING=true
          test/alt_microblogging_test.dart
          test/alt_microblogging_journey_test.dart

      - name: Alt Microblogging layout previews
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feat/alt-microblogging'
        uses: actions/upload-artifact@v4
        with:
          name: alt-microblogging-layouts
          path: review-artifacts/renders/alt-microblogging-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Reader recovery regressions
        run: >-
          flutter test --reporter expanded --timeout 90s
          test/home_timeline_layout_test.dart
          test/read_recovery_widget_test.dart
          test/reader_reliability_test.dart
          test/paging_recovery_test.dart
          test/local_undo_test.dart
          test/annotation_backup_test.dart
          test/reader_recovery_controls_test.dart
          test/video_controller_pool_test.dart
          test/home_filter_drawer_review_test.dart
          test/home_chrome_test.dart
          test/navigation_swipe_test.dart
          test/profile_design_primitives_test.dart
          test/quiet_reader_failure_test.dart
          test/read_failure_kind_test.dart
          test/stale_feed_preview_test.dart
          test/transaction_key_test.dart
          test/x_request_recovery_test.dart

      - name: Reader safety regressions
        run: >-
          flutter test --reporter expanded
          test/subscription_health_test.dart
          test/loaded_feed_search_test.dart
          test/video_memory_pressure_test.dart
          test/webdav_sync_test.dart
          test/resumable_download_test.dart
          test/download_center_test.dart
          test/rate_limit_retry_test.dart

      - name: Search regressions
        run: >-
          flutter test --reporter expanded --timeout 90s
          test/search_scope_test.dart
          test/search_chrome_test.dart
          test/search_results_entry_test.dart
          test/search_users_lifetime_test.dart
          test/advanced_search_test.dart
          test/advanced_search_form_test.dart

      - name: X reader regressions
        run: >-
          flutter test --reporter expanded --timeout 90s
          test/x_reader_hub_test.dart
          test/tweet_footer_actions_test.dart
          test/tweet_footer_semantics_test.dart
          test/tweet_open_test.dart

      - name: Mastodon reader regressions
        run: >-
          flutter test --reporter expanded --timeout 90s
          test/mastodon_timeline_controls_test.dart
          test/mastodon_reader_metadata_test.dart
          test/mastodon_feed_reliability_test.dart
          test/mastodon_profile_reader_test.dart
          test/mastodon_thread_reader_test.dart
          test/mastodon_reading_cards_test.dart
          test/mastodon_search_hashtag_test.dart
          test/mastodon_reading_experience_test.dart
          test/mastodon_content_warning_test.dart

      - name: Bluesky reader regressions
        run: >-
          flutter test --reporter expanded --timeout 90s
          test/bluesky_protocol_regression_test.dart
          test/bluesky_following_recovery_test.dart
          test/bluesky_search_upgrade_test.dart
          test/bluesky_feed_browser_test.dart
          test/bluesky_profile_upgrade_test.dart
          test/bluesky_conversation_controls_test.dart
          test/bluesky_reader_controls_test.dart
          test/bluesky_home_recovery_test.dart
          test/bluesky_reading_layout_test.dart

      - name: Substack reader regressions
        run: >-
          flutter test --reporter expanded --timeout 90s
          test/substack_protocol_regression_test.dart
          test/substack_store_recovery_test.dart
          test/substack_home_controls_test.dart
          test/substack_search_upgrade_test.dart
          test/substack_publication_reader_test.dart
          test/substack_discussion_reader_test.dart
          test/substack_article_navigation_test.dart
          test/substack_article_navigation_layout_test.dart
          test/substack_reader_recovery_test.dart

      - name: Substack compact layout previews
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/substack-declutter'
        uses: actions/upload-artifact@v4
        with:
          name: substack-compact-layouts
          path: |
            review-artifacts/renders/substack-home-compact-de.png
            review-artifacts/renders/substack-home-large-rtl.png
            review-artifacts/renders/substack-following-sheet.png
            review-artifacts/renders/substack-options-large-rtl.png
          if-no-files-found: error
          retention-days: 2

      - name: Discover regressions
        run: >-
          flutter test --reporter expanded --timeout 90s
          test/discover_ia_test.dart
          test/discover_plugin_search_test.dart
          test/discover_reading_test.dart

      - name: Canary report regressions
        run: python3 scripts/test_report_canary.py

      - name: Test
        run: flutter test --reporter expanded
