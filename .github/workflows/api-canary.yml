name: api-canary
on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: api-canary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    name: Live checks - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: X
            key: x
            tests: test/live/guest_api_smoke_test.dart test/live/endpoint_canary_test.dart
          - service: Instagram
            key: instagram
            tests: test/live/instagram_search_smoke_test.dart
          - service: TikTok
            key: tiktok
            tests: test/live/tiktok_search_smoke_test.dart
          - service: Substack
            key: substack
            tests: test/live/substack_custom_domain_smoke_test.dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate sources
        run: |
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
      - name: Probe live endpoints
        id: probe
        env:
          TEST_FILES: ${{ matrix.tests }}
        run: |
          read -ra files <<< "$TEST_FILES"
          flutter test "${files[@]}" --dart-define=RUN_LIVE=true --reporter json > canary.jsonl 2>&1
      - name: Summarise this service
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          python3 scripts/report_canary.py "$SERVICE" "$RUN_URL" "$PROBE_OUTCOME" canary.jsonl canary-report.md
          cat canary-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report service failure
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ matrix.service }}
          SERVICE_KEY: ${{ matrix.key }}
        run: |
          label="canary-$SERVICE_KEY"
          gh label create "$label" --color B60205 --description "Live checks for $SERVICE" --force
          existing=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file canary-report.md
          else
            gh issue create --title "Live checks failed: $SERVICE" --label "$label" --body-file canary-report.md
          fi
