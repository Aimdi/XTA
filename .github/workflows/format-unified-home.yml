name: Format reviewed Home sources
on:
  push:
    branches: ['ui/unified-home-controls']
    paths: ['.github/workflows/format-unified-home.yml']
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'Aimdi/XTA' && github.ref == 'refs/heads/ui/unified-home-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Restore required imports and format only reviewed Home paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          imports = {
            'lib/home/home_source_picker.dart': "import 'package:xta/group/feed_read_position.dart';",
            'lib/home/home_screen.dart': "import 'package:xta/home/home_group_drawer.dart';",
          }
          for name, line in imports.items():
              path = Path(name)
              text = path.read_text()
              if line not in text: path.write_text(line + '\n' + text)
          paths = '''lib/home/_feed.dart
          lib/home/alt_microblogging_selector.dart
          lib/home/home_screen.dart
          lib/home/home_source_picker.dart
          lib/home/home_timeline_picker.dart
          lib/plugins/bluesky/bluesky_reader_view.dart
          lib/plugins/bluesky/bluesky_screen.dart
          lib/plugins/mastodon/mastodon_navigation.dart
          lib/plugins/mastodon/mastodon_people.dart
          lib/plugins/mastodon/mastodon_screen.dart
          lib/plugins/mastodon/mastodon_timeline_controls.dart
          lib/plugins/plugin_home_chrome.dart
          lib/plugins/plugin_home_dock.dart
          lib/plugins/plugin_reading_view.dart
          lib/plugins/substack/substack_reading_toolbar.dart
          lib/plugins/substack/substack_screen.dart
          lib/plugins/threads/threads_screen.dart
          test/alt_microblogging_journey_test.dart
          test/plugin_home_dock_test.dart
          test/unified_home_layout_test.dart
          test/unified_home_picker_test.dart
          test/home_dock_lifetime_test.dart'''.splitlines()
          subprocess.run(['dart', 'format', '--line-length', '120', *paths], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
      - name: Remove this one-time helper and commit
        run: |
          git rm -- .github/workflows/format-unified-home.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: restore Home imports and use 120-column formatting'
          git push origin HEAD:refs/heads/ui/unified-home-controls
