name: Unified Home checks

on:
  push:
    branches: ['ui/unified-home-controls']
  pull_request:
    paths:
      - 'lib/home/**'
      - 'lib/plugins/**'
      - 'test/*home*test.dart'
      - '.github/workflows/unified-home-check.yml'
permissions:
  contents: read
jobs:
  review-source:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare source for offline review
        run: git archive --format=zip --output="$RUNNER_TEMP/home-review-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: home-review-source-${{ github.sha }}
          path: ${{ runner.temp }}/home-review-source.zip
          retention-days: 1
  compact-home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Generate pinned sources
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
      - name: New Home behavior
        run: flutter test --no-pub --reporter expanded test/unified_home_picker_test.dart
