name: Unified Home checks

on:
  push:
    branches: ['ui/unified-home-controls']
  pull_request:
    paths:
      - 'lib/home/**'
      - 'lib/plugins/**'
      - 'test/*home*test.dart'
      - '.github/workflows/unified-home-check.yml'
permissions:
  contents: read
jobs:
  compact-home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Generate pinned sources
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run flutter_iconpicker:generate_packs --packs material
      - name: New Home behavior
        run: flutter test --no-pub --reporter expanded test/unified_home_picker_test.dart test/unified_home_layout_test.dart
