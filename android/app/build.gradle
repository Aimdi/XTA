plugins {
    id "com.android.application"
    // Built-in Kotlin migration (Flutter 3.44): do not apply kotlin-android.
    // Flutter still applies KGP while android.builtInKotlin=false so MainActivity
    // and unmigrated plugins keep compiling; the app uses kotlin.compilerOptions
    // instead of the removed android.kotlinOptions DSL.
    // https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers
    id "dev.flutter.flutter-gradle-plugin"
}


import com.android.build.OutputFile

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def keystoreFile = System.getenv('KEY_PATH')
if (keystoreFile != null && !keystoreFile.isEmpty()) {
    keystoreProperties.setProperty('storePassword', System.getenv('KEY_STORE_PASSWORD') ?: '');
    keystoreProperties.setProperty('keyPassword', System.getenv('KEY_PASSWORD') ?: '');
    keystoreProperties.setProperty('keyAlias', System.getenv('KEY_ALIAS') ?: '');
    keystoreProperties.setProperty('storeFile', System.getenv('KEY_PATH'));
}

android {
    namespace 'com.aimdi.xta'
    compileSdkVersion 37
    ndkVersion = "29.0.14206865"

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    defaultConfig {
        applicationId "com.aimdi.xta"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 37
        multiDexEnabled true
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }

        release {
            // Fall back to debug signing when no release keystore is configured,
            // so release builds work on forks without the upstream signing secrets
            signingConfig keystoreProperties.getProperty('storeFile') ? signingConfigs.release : signingConfigs.debug

            minifyEnabled = true
            shrinkResources = true

            applicationVariants.all { variant ->
                variant.outputs.all { output ->
                    def abiName = output.getFilter(OutputFile.ABI)
                    if (abiName == null) {
                        outputFileName = "xta-aimdi124.apk"
                    } else {
                        outputFileName = "xta-aimdi124_${abiName}.apk"
                    }
                }
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
}

ext.abiCodes = ["x86_64": 1, "armeabi-v7a": 2, "arm64-v8a": 3]
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode + abiVersionCode
        }
    }
}
